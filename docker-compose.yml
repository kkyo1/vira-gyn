services:
  postgres:
    image: postgres:16
    container_name: viragyn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: viragyn
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: viragyn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: viragyn-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data: